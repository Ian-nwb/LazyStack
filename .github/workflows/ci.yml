name: CI & Scaffold-and-Boot Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_typecheck:
    name: Build & TypeScript Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile frontend and CLI
        run: npm run build

      - name: Typecheck TypeScript codebase
        run: npx tsc --noEmit

      - name: Verify framework templates against catalog and Dockerfiles
        run: npm run verify:templates

      - name: Verify architecture presets against the scaffold plan
        run: npm run verify:layout

  cli_package_smoke:
    name: npm CLI Package Smoke Check
    needs: build_and_typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Pack and install the standalone CLI
        run: |
          npm pack ./packages/cli --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/pack.json', 'utf8'))[0].filename")"
          npm install --prefix "$RUNNER_TEMP/cli-smoke" "$RUNNER_TEMP/$TARBALL"

      - name: Exercise installed CLI commands
        run: |
          CLI="$RUNNER_TEMP/cli-smoke/node_modules/.bin/lazystack"
          "$CLI" --version
          "$CLI" init --preset fastapi-react --name ci-cli --out "$RUNNER_TEMP/lazystack.json"
          "$CLI" validate --config "$RUNNER_TEMP/lazystack.json"
          "$CLI" plan --config "$RUNNER_TEMP/lazystack.json"
          "$CLI" search playwright --json

      - name: Exercise existing-project import and add
        run: |
          CLI="$RUNNER_TEMP/cli-smoke/node_modules/.bin/lazystack"
          "$CLI" scaffold --preset fastapi-react --name existing --out "$RUNNER_TEMP/existing-parent"
          PROJECT="$RUNNER_TEMP/existing-parent/existing"
          test -f "$PROJECT/lazystack.json"
          (cd "$PROJECT/apps" && find . -type f -exec sha256sum {} + | sort) > "$RUNNER_TEMP/apps-before.txt"
          "$CLI" import --dir "$PROJECT"
          "$CLI" add --dir "$PROJECT" --tech rust-dioxus --name dashboard --dry-run
          test ! -e "$PROJECT/apps/dashboard"
          "$CLI" add --dir "$PROJECT" --tech go-echo --name billing
          test -f "$PROJECT/apps/billing/go.mod"
          grep -q billing "$PROJECT/lazystack.json"
          (cd "$PROJECT/apps" && find . -path ./billing -prune -o -type f -exec sha256sum {} + | sort) > "$RUNNER_TEMP/apps-after.txt"
          diff "$RUNNER_TEMP/apps-before.txt" "$RUNNER_TEMP/apps-after.txt"

  scaffold_boot_matrix:
    name: Scaffold & Boot (${{ matrix.preset }})
    needs: build_and_typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: t3-stack
            name: T3 Next.js + Postgres
            compose_file: infra/docker-compose.yml
          - preset: fastapi-react
            name: FastAPI + React + Redis
            compose_file: infra/docker-compose.yml
          - preset: modern-mern
            name: React + Express + MongoDB
            compose_file: infra/docker-compose.yml
          - preset: go-vue
            name: Go Fiber + Vue 3 + Redis
            compose_file: infra/docker-compose.yml
          - preset: rust-axum
            name: Rust Axum + SQLite
            compose_file: infra/docker-compose.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build LazyStack CLI
        run: npm run build:cli

      - name: Setup Python 3.12 for generated service checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go for generated Go service checks
        if: matrix.preset == 'go-vue'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust for generated Rust service checks
        if: matrix.preset == 'rust-axum'
        uses: dtolnay/rust-toolchain@stable

      - name: Export blueprint configuration
        run: |
          mkdir -p ./configs
          node ./bin/lazystack.js export --preset ${{ matrix.preset }} --out ./configs/${{ matrix.preset }}.json --name test-${{ matrix.preset }}

      - name: Scaffold monorepo stack
        run: |
          mkdir -p ./matrix-output
          node ./bin/lazystack.js scaffold -c ./configs/${{ matrix.preset }}.json -o ./matrix-output

      - name: Verify generated file tree
        run: |
          TARGET_DIR="./matrix-output/test-${{ matrix.preset }}"
          echo "Verifying files in $TARGET_DIR..."
          test -d "$TARGET_DIR"
          test -f "$TARGET_DIR/package.json"
          test -f "$TARGET_DIR/.env"
          test -f "$TARGET_DIR/${{ matrix.compose_file }}"
          echo "File tree verified successfully."

      - name: Validate Docker Compose specification
        run: |
          TARGET_DIR="./matrix-output/test-${{ matrix.preset }}"
          echo "Validating Docker Compose syntax..."
          docker compose -f "$TARGET_DIR/${{ matrix.compose_file }}" config --quiet
          echo "Docker compose configuration is valid and boot-ready."

      - name: Test and build generated Go service
        if: matrix.preset == 'go-vue'
        run: |
          cd ./matrix-output/test-go-vue/apps/service
          go mod tidy
          go test ./...
          go build ./...

      - name: Test and build generated Rust service
        if: matrix.preset == 'rust-axum'
        run: |
          cd ./matrix-output/test-rust-axum/apps/engine
          cargo test
          cargo build

      - name: Build generated React frontend
        if: matrix.preset == 'fastapi-react'
        run: |
          cd ./matrix-output/test-fastapi-react/apps/client
          npm install --no-audit --no-fund
          npm run build

      - name: Install and syntax-check generated FastAPI backend
        if: matrix.preset == 'fastapi-react'
        run: |
          python -m pip install --disable-pip-version-check -r ./matrix-output/test-fastapi-react/apps/api/requirements.txt
          python -m compileall -q ./matrix-output/test-fastapi-react/apps/api

      - name: Boot generated FastAPI and check health endpoint
        if: matrix.preset == 'fastapi-react'
        run: |
          cd ./matrix-output/test-fastapi-react/apps/api
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health

      - name: Boot generated stack and route through every reverse proxy
        if: matrix.preset == 'fastapi-react'
        run: |
          ROOT="$PWD/matrix-output/test-fastapi-react"
          docker compose -p lsci --env-file "$ROOT/.env" -f "$ROOT/infra/docker-compose.yml" up -d --build --wait --wait-timeout 300 || true
          cleanup() {
            docker compose -p lsci -f "$ROOT/infra/docker-compose.yml" logs --tail 50 || true
            docker rm -f px-apache px-caddy px-traefik >/dev/null 2>&1 || true
            docker compose -p lsci -f "$ROOT/infra/docker-compose.yml" down -v || true
          }
          trap cleanup EXIT
          check() { curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 "http://127.0.0.1:$1$2"; echo; }
          # nginx (the preset's proxy) is part of the Compose stack.
          check 80 /
          check 80 /api/health
          # Swap in each other proxy's generated config against the same running apps.
          port=8081
          for proxy in apache caddy traefik; do
            node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));c.proxy={...c.proxy,type:process.argv[2],httpPort:+process.argv[3]};c.projectName="px-"+process.argv[2];fs.writeFileSync("px.json",JSON.stringify(c));' "$ROOT/lazystack.json" $proxy $port
            node ./bin/lazystack.js scaffold --config px.json --out ./proxy-output >/dev/null
            CFG="$PWD/proxy-output/px-$proxy/infra/$proxy"
            case $proxy in
              apache)  docker run -d --name px-$proxy --network lsci_lazystack_net -p $port:$port -v "$CFG/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro" httpd:alpine ;;
              caddy)   docker run -d --name px-$proxy --network lsci_lazystack_net -p $port:$port -v "$CFG/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine ;;
              traefik) docker run -d --name px-$proxy --network lsci_lazystack_net -p $port:$port -v "$CFG:/etc/traefik:ro" traefik:v3.3 --configFile=/etc/traefik/traefik.yml ;;
            esac
            echo "== $proxy"
            check $port / || { docker logs px-$proxy; exit 1; }
            check $port /api/health || { docker logs px-$proxy; exit 1; }
            port=$((port + 1))
          done

      - name: Generate API-service profile fixture
        if: matrix.preset == 'fastapi-react'
        run: |
          node ./bin/lazystack.js export --preset fastapi-react --name test-fastapi-api-service --out ./configs/fastapi-api-service.json
          node -e 'const fs=require("fs");const p="./configs/fastapi-api-service.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const api=c.apps.find(item=>item.techId==="python-fastapi");const client=c.apps.find(item=>item.role==="frontend");if(!api||!client)throw new Error("FastAPI API or frontend missing");api.starterProfile="api-service";api.testingTools=["swagger-openapi"];client.testingTools=["openapi-client"];client.connections=[{targetAppId:api.id,envVar:"API_URL",protocol:"http"}];fs.writeFileSync(p,JSON.stringify(c,null,2));'
          node ./bin/lazystack.js scaffold --config ./configs/fastapi-api-service.json --out ./matrix-output-api

      - name: Generate and typecheck connected OpenAPI client
        if: matrix.preset == 'fastapi-react'
        run: |
          cd ./matrix-output-api/test-fastapi-api-service/apps/client
          npm install --no-audit --no-fund
          npm run api:generate
          npx tsc --noEmit
          npm run build

      - name: Install and test generated FastAPI API-service profile
        if: matrix.preset == 'fastapi-react'
        run: |
          API_DIR=./matrix-output-api/test-fastapi-api-service/apps/api
          python -m pip install --disable-pip-version-check -r "$API_DIR/requirements.txt"
          cd "$API_DIR"
          python -m compileall -q .
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          API_TOKEN=ci-test-token DATABASE_URL=sqlite:///./ci.db python -m pytest -q

  workspace_mode_matrix:
    name: Workspace Mode (${{ matrix.mode }})
    needs: build_and_typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, unified]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build LazyStack CLI
        run: npm run build:cli

      - name: Export and scaffold both workspace modes
        run: |
          mkdir -p ./workspace-output ./configs
          node ./bin/lazystack.js export --preset fastapi-react --name qa-${{ matrix.mode }} --out ./configs/qa-${{ matrix.mode }}.json ${{ matrix.mode == 'native' && '--native-only' || '--unified-workspace' }}
          node ./bin/lazystack.js scaffold --config ./configs/qa-${{ matrix.mode }}.json --out ./workspace-output

      - name: Verify generated workspace mode
        run: |
          TARGET_DIR="./workspace-output/qa-${{ matrix.mode }}"
          test -f "$TARGET_DIR/apps/client/package.json"
          test -f "$TARGET_DIR/apps/api/requirements.txt"
          if [ "${{ matrix.mode }}" = "native" ]; then
            test ! -e "$TARGET_DIR/package.json"
            test ! -e "$TARGET_DIR/pnpm-workspace.yaml"
            test ! -e "$TARGET_DIR/turbo.json"
            test ! -d "$TARGET_DIR/packages"
          else
            test -f "$TARGET_DIR/package.json"
            test -f "$TARGET_DIR/pnpm-workspace.yaml"
            test -f "$TARGET_DIR/turbo.json"
            test -f "$TARGET_DIR/packages/types/package.json"
          fi
          docker compose -f "$TARGET_DIR/infra/docker-compose.yml" config --quiet

  native_project_matrix:
    name: Native Project (${{ matrix.language }})
    needs: build_and_typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-springboot
            tech_id: java-springboot
          - language: kotlin-ktor
            tech_id: kotlin-ktor
          - language: php
            tech_id: vanilla-php
          - language: java-swing
            tech_id: java-swing
          - language: java-javafx
            tech_id: java-javafx
          - language: expo
            tech_id: react-native-expo
            node: 22
          - language: capacitor
            tech_id: capacitor-app
            node: 22
          - language: maui
            tech_id: csharp-maui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and build CLI
        run: npm ci && npm run build:cli

      - name: Setup Node.js 22 for generated mobile apps
        if: matrix.node == 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET 10
        if: matrix.tech_id == 'csharp-maui'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Java 17
        if: matrix.tech_id == 'java-springboot' || matrix.tech_id == 'kotlin-ktor' || matrix.tech_id == 'java-swing' || matrix.tech_id == 'java-javafx'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: matrix.tech_id == 'kotlin-ktor'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up PHP
        if: matrix.tech_id == 'vanilla-php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Export a native-only blueprint
        run: |
          mkdir -p ./configs ./native-output
          node ./bin/lazystack.js export --preset t3-stack --name native-${{ matrix.language }} --native-only --out ./configs/native-${{ matrix.language }}.json
          node -e 'const fs=require("fs");const p="./configs/native-${{ matrix.language }}.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.apps=[{...c.apps[0],id:"native-service",folderName:"service",role:"backend",techId:"${{ matrix.tech_id }}",port:8080,connections:[]}];c.databases=[];c.proxy={type:"none",httpPort:80};c.useUnifiedWorkspace=false;fs.writeFileSync(p,JSON.stringify(c,null,2));'
          node ./bin/lazystack.js scaffold --config ./configs/native-${{ matrix.language }}.json --out ./native-output

      - name: Verify native project files and Compose config
        run: |
          TARGET_DIR="./native-output/native-${{ matrix.language }}"
          test -f "$TARGET_DIR/infra/docker-compose.yml"
          test ! -e "$TARGET_DIR/package.json"
          test ! -e "$TARGET_DIR/pnpm-workspace.yaml"
          docker compose -f "$TARGET_DIR/infra/docker-compose.yml" config --quiet
          if [ "${{ matrix.tech_id }}" = 'java-springboot' ]; then test -f "$TARGET_DIR/apps/service/pom.xml"; fi
          if [ "${{ matrix.tech_id }}" = 'kotlin-ktor' ]; then test -f "$TARGET_DIR/apps/service/build.gradle.kts"; fi
          if [ "${{ matrix.tech_id }}" = 'vanilla-php' ]; then test -f "$TARGET_DIR/apps/service/composer.json"; fi
          if [ "${{ matrix.tech_id }}" = 'java-swing' ] || [ "${{ matrix.tech_id }}" = 'java-javafx' ]; then test -f "$TARGET_DIR/apps/service/pom.xml"; test ! -e "$TARGET_DIR/apps/service/Dockerfile"; fi
          if [ "${{ matrix.tech_id }}" = 'react-native-expo' ]; then test -f "$TARGET_DIR/apps/service/app.json"; test ! -e "$TARGET_DIR/apps/service/Dockerfile"; fi
          if [ "${{ matrix.tech_id }}" = 'capacitor-app' ]; then test -f "$TARGET_DIR/apps/service/capacitor.config.ts"; test -f "$TARGET_DIR/apps/service/Dockerfile"; fi
          if [ "${{ matrix.tech_id }}" = 'csharp-maui' ]; then test -f "$TARGET_DIR/apps/service/service.csproj"; test ! -e "$TARGET_DIR/apps/service/Dockerfile"; fi

      - name: Build and test generated Spring Boot project
        if: matrix.tech_id == 'java-springboot'
        run: mvn --batch-mode --no-transfer-progress -f ./native-output/native-${{ matrix.language }}/apps/service/pom.xml test package

      - name: Build and test generated Ktor project
        if: matrix.tech_id == 'kotlin-ktor'
        run: gradle -p ./native-output/native-${{ matrix.language }}/apps/service test build

      - name: Syntax-check generated PHP project
        if: matrix.tech_id == 'vanilla-php'
        run: php -l ./native-output/native-${{ matrix.language }}/apps/service/public/index.php

      - name: Build and test generated Swing project
        if: matrix.tech_id == 'java-swing'
        run: mvn --batch-mode --no-transfer-progress -f ./native-output/native-${{ matrix.language }}/apps/service/pom.xml test package

      - name: Compile generated JavaFX project
        if: matrix.tech_id == 'java-javafx'
        run: mvn --batch-mode --no-transfer-progress -f ./native-output/native-${{ matrix.language }}/apps/service/pom.xml compile

      - name: Typecheck and test generated Expo app
        if: matrix.tech_id == 'react-native-expo'
        working-directory: ./native-output/native-${{ matrix.language }}/apps/service
        run: npm install --no-audit --no-fund && npx tsc --noEmit && npm test

      - name: Build and test generated Capacitor app
        if: matrix.tech_id == 'capacitor-app'
        working-directory: ./native-output/native-${{ matrix.language }}/apps/service
        run: npm install --no-audit --no-fund && npm run build && npm test && npx cap ls

      # The full MAUI build needs the maui-android workload and Android SDK (several GB); the
      # platform-free view models are tested on plain .NET 10 instead.
      - name: Test generated .NET MAUI view models
        if: matrix.tech_id == 'csharp-maui'
        run: dotnet test ./native-output/native-${{ matrix.language }}/apps/service/tests/Service.Tests

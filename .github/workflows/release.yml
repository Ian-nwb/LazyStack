name: Release

# Push a tag like v2.0.0 to build the Linux AppImage and Windows portable EXE on GitHub's
# runners, publish them as a GitHub release (notes from CHANGELOG.md), and
# publish the CLI to npm with provenance and to GitHub Packages as @<owner>/lazystack
# (GitHub Packages uses the built-in GITHUB_TOKEN; nothing to configure).
#
# npm: either configure a Trusted Publisher for this repository and workflow on npmjs.com
# (no secret needed), or add an NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-latest
            args: --linux AppImage
            files: release/*/*.AppImage
          - name: Windows portable
            os: windows-latest
            args: --win portable
            files: release/*/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\nFull notes: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their release/<version>/ folder; upload the files, not the folder.
          mapfile -t assets < <(find dist-release -type f)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "LazyStack $GITHUB_REF_NAME" --notes-file notes.md
          fi

  npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'
      - run: npm ci
      - run: npm run build:cli
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "lazystack@$version" version >/dev/null 2>&1; then
            echo "lazystack@$version is already on npm"
          else
            npm publish --provenance --access public
          fi

  github-packages:
    name: Publish CLI to GitHub Packages
    runs-on: ubuntu-latest
    # Same build as the npm job, published as @<owner>/lazystack so the repo's Packages box tracks releases.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
      - run: npm ci
      - run: npm run build:cli
      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # GitHub's npm registry only accepts names scoped to the (lowercase) repository owner.
          name="@${OWNER,,}/lazystack"
          version=$(node -p "require('./package.json').version")
          npm pkg set name="$name" publishConfig.registry=https://npm.pkg.github.com publishConfig.access=public
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on GitHub Packages"
          else
            npm publish
          fi

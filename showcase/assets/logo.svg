<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" width="288" height="256" role="img" aria-label="LazyStack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LazyStack</title>
  <style>
    path { fill: none; stroke: #050505; stroke-width: 3; stroke-linejoin: miter; stroke-linecap: butt; stroke-dasharray: 1 2; stroke-dashoffset: 0; }
    .t { fill: #050505; }
    @media (prefers-color-scheme: dark) { path { stroke: #fff; } .t { fill: #fff; } }
    @media (prefers-reduced-motion: no-preference) {
      path { stroke-dashoffset: 1; animation: d 900ms cubic-bezier(.16,1,.3,1) both; }
      .b { animation-delay: 0ms; } .m { animation-delay: 140ms; } .t { animation-delay: 280ms; }
      .t { fill-opacity: 0; animation: d 900ms cubic-bezier(.16,1,.3,1) 280ms both, f 500ms ease 1180ms both; }
    }
    @keyframes d { to { stroke-dashoffset: 0; } }
    @keyframes f { to { fill-opacity: 1; } }
  </style>
  <path class="b" pathLength="1" d="M6 46 30 58 54 46"/>
  <path class="m" pathLength="1" d="M14 32 38 44 62 32"/>
  <path class="t" pathLength="1" d="M30 6 54 18 30 30 6 18Z"/>
</svg>
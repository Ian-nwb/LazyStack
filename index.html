<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LazyStack — Monorepo Architecture Studio</title>
    <style>
      /* Startup screen: pure HTML/CSS so it paints before the app bundle loads. */
      #splash {
        position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
        background: #050505; color: #fff; font-family: "Archivo", system-ui, sans-serif;
        transition: opacity .45s cubic-bezier(.16, 1, .3, 1), visibility .45s;
      }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash .lockup { position: relative; display: grid; justify-items: center; gap: 22px; }
      #splash svg { width: 92px; height: 86px; overflow: visible; }
      #splash .chev { fill: none; stroke: currentColor; stroke-width: 5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-dash .9s cubic-bezier(.65, 0, .35, 1) forwards; }
      #splash .c1 { stroke-opacity: .4; }
      #splash .c2 { stroke-opacity: .7; animation-delay: .14s; }
      #splash .cell { fill: currentColor; transform-box: fill-box; transform-origin: center; opacity: 0; animation: sp-pop .55s cubic-bezier(.16, 1, .3, 1) forwards; }
      #splash .word { display: flex; align-items: baseline; gap: 12px; opacity: 0; animation: sp-rise .7s cubic-bezier(.16, 1, .3, 1) .55s forwards; }
      #splash .word b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
      #splash .word span { font-size: 13px; font-weight: 700; color: #050505; background: #fff; padding: 3px 7px; letter-spacing: .02em; }
      #splash .bar { width: 168px; height: 2px; background: #1c1c1f; overflow: hidden; opacity: 0; animation: sp-rise .5s ease .75s forwards; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #fff; animation: sp-load 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
      #splash .status { font: 12px/1 ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; color: #8a8a93; opacity: 0; animation: sp-rise .5s ease .85s forwards; }
      @keyframes sp-dash { to { stroke-dashoffset: 0; } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        #splash .bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body class="bg-surface-900 text-slate-100 font-sans antialiased overflow-hidden select-none">
    <div id="splash" role="status" aria-live="polite" aria-label="Loading LazyStack">
      <div class="lockup">
        <svg viewBox="4 4 60 56" aria-hidden="true">
          <path class="chev c1" pathLength="1" d="M6 46 30 58 54 46" />
          <path class="chev c2" pathLength="1" d="M14 32 38 44 62 32" />
          <path class="cell" style="animation-delay:.45s" d="M30 6 40.2 11.1 30 16.2 19.8 11.1Z" />
          <path class="cell" style="animation-delay:.53s" d="M16.2 12.9 26.4 18 16.2 23.1 6 18Z" />
          <path class="cell" style="animation-delay:.61s" d="M43.8 12.9 54 18 43.8 23.1 33.6 18Z" />
          <path class="cell" style="animation-delay:.69s" d="M30 19.8 40.2 24.9 30 30 19.8 24.9Z" />
        </svg>
        <div class="word"><b>LazyStack</b><span>3.0</span></div>
        <div class="bar" aria-hidden="true"></div>
        <div class="status" id="splash-status">Starting…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
